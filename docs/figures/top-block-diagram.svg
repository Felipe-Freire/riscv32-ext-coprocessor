<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- Opaque background so the figure reads in GitHub dark mode -->
  <rect width="760" height="320" fill="#ffffff"/>

  <text x="20" y="28" font-size="15" font-weight="bold" fill="#1f1f1f">Top level (preliminary)</text>

  <!-- Integration top -->
  <rect x="10" y="44" width="740" height="262" rx="8" fill="none" stroke="#888" stroke-dasharray="6 4"/>
  <text x="22" y="64" font-size="12" fill="#666" font-family="Menlo, Consolas, monospace">soc_top</text>

  <!-- Memories -->
  <rect x="40" y="90" width="150" height="64" rx="6" fill="#f1f3f4" stroke="#777"/>
  <text x="115" y="118" font-size="13" text-anchor="middle" fill="#1f1f1f">Instruction</text>
  <text x="115" y="136" font-size="13" text-anchor="middle" fill="#1f1f1f">memory</text>

  <rect x="40" y="200" width="150" height="64" rx="6" fill="#f1f3f4" stroke="#777"/>
  <text x="115" y="237" font-size="13" text-anchor="middle" fill="#1f1f1f">Data memory</text>

  <!-- RV32 core -->
  <rect x="290" y="90" width="170" height="174" rx="6" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="375" y="172" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f1f1f">RV32 core</text>
  <text x="375" y="192" font-size="11" text-anchor="middle" fill="#444">fetch · decode · execute · LSU</text>

  <!-- Coprocessor -->
  <rect x="580" y="90" width="160" height="174" rx="6" fill="#fdeee6" stroke="#d9773b" stroke-width="1.5"/>
  <text x="660" y="164" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f1f1f">Matrix mult.</text>
  <text x="660" y="182" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f1f1f">coprocessor</text>
  <text x="660" y="202" font-size="11" text-anchor="middle" fill="#444">control · MAC array · buffers</text>

  <!-- Core <-> memories -->
  <line x1="192" y1="122" x2="288" y2="122" stroke="#444" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="240" y="114" font-size="12" text-anchor="middle" fill="#444">fetch</text>
  <line x1="192" y1="232" x2="288" y2="232" stroke="#444" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="240" y="224" font-size="12" text-anchor="middle" fill="#444">load / store</text>

  <!-- Core <-> coprocessor -->
  <line x1="462" y1="150" x2="578" y2="150" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="142" font-size="12" text-anchor="middle" fill="#444">instr + operands</text>
  <line x1="578" y1="208" x2="462" y2="208" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="200" font-size="12" text-anchor="middle" fill="#444">result</text>
</svg>
